<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Product Detail Management - The Matcha Atelier</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
      <script src="../assets/js/tailwind-config.js"></script>
<link
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
      <link rel="stylesheet" href="../assets/css/style.css?v=app-font-20260605" />
</head>

<body class="page-product-detail bg-background text-on-surface flex min-h-screen" data-page="product-detail">
    <!-- SideNavBar Component -->
    <aside id="app-sidebar" class="h-screen w-72 fixed left-0 top-0 z-40 bg-[#002c04] dark:bg-[#001a02] shadow-[32px_0_64px_-12px_rgba(0,44,4,0.08)] flex flex-col py-8 px-6"></aside>
    <!-- TopAppBar -->
    <header id="app-topbar" class="fixed top-0 right-0 left-72 h-20 z-30 bg-[#f9f9f8]/80 dark:bg-[#191c1c]/80 backdrop-blur-2xl flex items-center justify-between px-10"></header>
    <!-- Product Detail Content -->
    <main class="ml-72 min-h-screen w-[calc(100%-18rem)] pt-20 p-10 space-y-8">
        <!-- Hero Header Section (Asymmetric) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start mb-16">
            <!-- Product Image -->
            <div class="lg:col-span-5">
                <div class="h-[520px] rounded-xl overflow-hidden shadow-sm bg-surface-container">
                    <img id="product-detail-main-image" alt=""
                        class="hidden w-full h-full object-cover hover:scale-105 transition-transform duration-700" />
                    <div id="product-detail-image-placeholder"
                        class="flex h-full w-full items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined text-7xl">restaurant</span>
                    </div>
                </div>
            </div>
            <!-- Primary Meta Fields -->
            <div class="lg:col-span-7 space-y-8">
                <div>
                    <span class="text-xs font-bold uppercase tracking-[0.2em] text-secondary mb-2 block">Product
                        Identity</span>
                    <input id="product-detail-name"
                        class="w-full border-none bg-transparent p-0 text-5xl font-serif italic text-primary leading-tight focus:ring-0"
                        type="text" value="Loading product..." />
                    <textarea id="product-detail-description"
                        class="mt-4 min-h-28 w-full resize-y rounded-xl border-outline bg-surface-container-lowest px-4 py-3 text-on-surface-variant leading-relaxed font-medium focus:border-secondary focus:ring-secondary">Loading product description...</textarea>
                </div>
                <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                    <div class="p-6 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10">
                        <label
                            class="text-[10px] uppercase font-bold text-on-surface/40 tracking-widest block mb-2">Base
                            Price</label>
                        <div class="flex items-baseline gap-1">
                            <span class="text-2xl font-serif text-primary">₫</span>
                            <input id="product-detail-price"
                                class="min-w-0 flex-1 text-3xl font-serif text-primary bg-transparent border-none p-0 focus:ring-0"
                                type="text" value="" />
                        </div>
                    </div>
                    <div class="p-6 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10">
                        <label
                            class="text-[10px] uppercase font-bold text-on-surface/40 tracking-widest block mb-2">Category</label>
                        <select id="product-detail-category"
                            class="bg-transparent border-none p-0 w-full text-lg font-serif text-primary focus:ring-0 appearance-none">
                            <option value="" disabled selected>Loading...</option>
                        </select>
                    </div>
                    <label class="p-6 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/10 md:col-span-2">
                        <span class="text-[10px] uppercase font-bold text-on-surface/40 tracking-widest block mb-2">Image URL</span>
                        <input id="product-detail-image-url"
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary"
                            type="url" placeholder="Enter image URL" />
                    </label>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-bold text-primary">Availability</span>
                        <div id="product-detail-availability"
                            class="flex items-center gap-2 bg-surface-container text-on-surface-variant px-3 py-1 rounded-full text-xs font-bold">
                            <span class="w-2 h-2 bg-on-surface-variant rounded-full"></span>
                            Loading
                        </div>
                    </div>
                    <div class="p-1 bg-surface-container rounded-xl flex gap-1">
                        <button type="button" data-availability="true"
                            class="flex-1 py-3 text-xs font-bold uppercase bg-surface-container-lowest text-primary rounded-lg shadow-sm">Available</button>
                        <button type="button" data-availability="false"
                            class="flex-1 py-3 text-xs font-bold uppercase text-on-surface/40 hover:text-on-surface transition-colors">Unavailable</button>
                    </div>
                    <p id="product-detail-status" class="hidden text-sm font-bold"></p>
                </div>
            </div>
        </div>
        <!-- Detailed Management Bento Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Ingredients Section (Bento Card 1) -->
            <div class="lg:col-span-3 bg-surface-container-lowest rounded-2xl p-8 shadow-sm">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-serif italic text-primary">Ingredients</h3>
                    <div class="flex items-center gap-3">
                        <button id="add-recipe-ingredient" type="button"
                            class="w-10 h-10 bg-secondary/10 text-secondary rounded-full flex items-center justify-center hover:bg-secondary hover:text-white transition-all"
                            aria-label="Add recipe ingredient">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                        <button id="save-product-recipe" type="button"
                            class="rounded-full bg-primary px-5 py-2.5 text-sm font-bold text-white hover:bg-primary/90">
                            Save Recipe
                        </button>
                    </div>
                </div>
                <ul id="product-recipe-list" class="space-y-6">
                    <li class="rounded-xl bg-surface-container-low p-4 text-sm font-bold text-on-surface-variant">
                        Loading recipe ingredients...
                    </li>
                </ul>
            </div>
        </div>
        <!-- Footer Actions -->
        <div class="mt-12 pt-8 border-t border-outline-variant/20 flex justify-end gap-4">
            <button id="delete-product-detail" type="button"
                class="px-10 py-4 text-error font-bold hover:bg-error-container/30 rounded-xl transition-all">Delete
                Product</button>
            <button id="discard-product-detail" type="button"
                class="px-10 py-4 text-on-surface-variant font-bold hover:bg-surface-container rounded-xl transition-all">Discard
                Changes</button>
            <button id="save-product-detail" type="button"
                class="px-12 py-4 bg-secondary text-white font-bold rounded-xl shadow-lg shadow-secondary/20 hover:scale-[1.02] active:scale-[0.98] transition-all">Save
                Product Details</button>
        </div>
        <!-- Footer Meta Info -->
        <div class="mt-12 text-center">
            <p class="text-[10px] text-stone-400 font-label uppercase tracking-widest">Hoppers' Matcha Internal Portal © 2026</p>
        </div>
    </main>
  <script src="../assets/js/layout.js?v=product-detail-hide-search-20260606"></script>
  <script src="../assets/js/main.js?v=fm-20260530"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('topbar-search')?.closest('.bg-surface-container')?.remove();

        const API_BASE_URL = window.MATCHA_API_BASE_URL || 'http://localhost:8000/api/v1';
        const productId = new URLSearchParams(window.location.search).get('id');
        const nameElement = document.getElementById('product-detail-name');
        const descriptionElement = document.getElementById('product-detail-description');
        const priceInput = document.getElementById('product-detail-price');
        const categorySelect = document.getElementById('product-detail-category');
        const imageUrlInput = document.getElementById('product-detail-image-url');
        const statusElement = document.getElementById('product-detail-status');
        const saveButton = document.getElementById('save-product-detail');
        const discardButton = document.getElementById('discard-product-detail');
        const deleteButton = document.getElementById('delete-product-detail');
        const recipeList = document.getElementById('product-recipe-list');
        const addRecipeIngredientButton = document.getElementById('add-recipe-ingredient');
        const saveRecipeButton = document.getElementById('save-product-recipe');
        let currentProduct = null;
        let productCategories = [];
        let ingredients = [];

        const fetchApiData = async (path, options = {}) => {
            const response = await fetch(`${API_BASE_URL}${path}`, options);
            const payload = await response.json().catch(() => null);

            if (!response.ok || payload?.success === false) {
                throw new Error(payload?.message || 'Request failed');
            }

            return payload?.data ?? payload;
        };

        const getListData = (data) => {
            if (Array.isArray(data)) return data;
            if (Array.isArray(data?.items)) return data.items;
            return [];
        };
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[character]));

        const formatPriceValue = (value) => new Intl.NumberFormat('vi-VN').format(Number(value) || 0);
        const parsePriceValue = (value) => {
            const normalized = String(value || '').trim();
            if (!normalized) return 0;

            const localeNumber = normalized.includes(',')
                ? normalized.replace(/\./g, '').replace(',', '.')
                : normalized.replace(/\./g, '');
            return Number(localeNumber.replace(/[^\d.-]/g, '')) || 0;
        };
        const setFieldValue = (element, value) => {
            if (!element) return;
            if ('value' in element) {
                element.value = value;
            } else {
                element.textContent = value;
            }
        };
        const setStatus = (message, type = 'info') => {
            if (!statusElement) return;
            statusElement.textContent = message;
            statusElement.className = `text-sm font-bold ${type === 'error' ? 'text-error' : 'text-secondary'}`;
            statusElement.classList.toggle('hidden', !message);
        };

        const deriveCategories = (products) => (
            [...new Set(products.map((product) => product.category).filter(Boolean))]
                .sort((first, second) => first.localeCompare(second))
        );

        const populateCategorySelect = (categories, selectedCategory) => {
            categorySelect.innerHTML = '';

            categories.forEach((category) => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                option.selected = category === selectedCategory;
                categorySelect.appendChild(option);
            });

            if (selectedCategory && !categories.includes(selectedCategory)) {
                const option = document.createElement('option');
                option.value = selectedCategory;
                option.textContent = selectedCategory;
                option.selected = true;
                categorySelect.appendChild(option);
            }

            if (!categorySelect.options.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No category';
                option.disabled = true;
                option.selected = true;
                categorySelect.appendChild(option);
            }
        };

        const setAvailability = (isAvailable) => {
            const availability = document.getElementById('product-detail-availability');
            if (!availability || typeof isAvailable !== 'boolean') return;

            const dotClass = isAvailable ? 'bg-secondary' : 'bg-error';
            availability.className = isAvailable
                ? 'flex items-center gap-2 bg-secondary/10 text-secondary px-3 py-1 rounded-full text-xs font-bold'
                : 'flex items-center gap-2 bg-error-container/30 text-error px-3 py-1 rounded-full text-xs font-bold';
            availability.innerHTML = `<span class="w-2 h-2 ${dotClass} rounded-full"></span>${isAvailable ? 'Active' : 'Inactive'}`;

            document.querySelectorAll('[data-availability]').forEach((button) => {
                const buttonValue = button.dataset.availability === 'true';
                const isSelected = buttonValue === isAvailable;
                button.className = isSelected
                    ? 'flex-1 py-3 text-xs font-bold uppercase bg-surface-container-lowest text-primary rounded-lg shadow-sm'
                    : 'flex-1 py-3 text-xs font-bold uppercase text-on-surface/40 hover:text-on-surface transition-colors';
            });
        };

        const getIngredient = (ingredientId) => ingredients.find((ingredient) => ingredient.id === ingredientId);

        const showRecipeEmptyState = () => {
            recipeList.innerHTML = `
                <li class="recipe-empty-state rounded-xl bg-surface-container-low p-4 text-sm font-bold text-on-surface-variant">
                    No recipe ingredients configured.
                </li>
            `;
        };

        const createRecipeRow = (item = {}) => {
            if (!ingredients.length) {
                recipeList.innerHTML = `
                    <li class="recipe-empty-state rounded-xl bg-surface-container-low p-4 text-sm font-bold text-on-surface-variant">
                        No ingredients available. Add ingredients in inventory first.
                    </li>
                `;
                return;
            }

            recipeList.querySelector('.recipe-empty-state')?.remove();

            const selectedIngredientId = item.ingredient_id || ingredients[0].id;
            const selectedIngredient = getIngredient(selectedIngredientId);
            const row = document.createElement('li');
            row.className = 'recipe-ingredient-row grid grid-cols-1 gap-4 rounded-2xl border border-outline-variant bg-surface-container-low p-4 md:grid-cols-[minmax(0,1fr)_170px_56px]';
            row.innerHTML = `
                <label class="space-y-2">
                    <span class="text-xs font-bold text-on-surface-variant">Ingredient</span>
                    <select class="recipe-ingredient-select w-full rounded-xl border-outline bg-surface px-3 py-2 text-sm focus:border-secondary focus:ring-secondary"></select>
                    <span class="recipe-ingredient-unit text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">${escapeHtml(selectedIngredient?.unit || item.unit || '')}</span>
                </label>
                <label class="space-y-2">
                    <span class="text-xs font-bold text-on-surface-variant">Quantity per serving</span>
                    <input class="recipe-ingredient-quantity w-full rounded-xl border-outline bg-surface px-3 py-2 text-sm focus:border-secondary focus:ring-secondary"
                        type="number" min="0.001" step="0.001" value="${escapeHtml(item.quantity_per_serving ?? '')}" />
                </label>
                <button type="button"
                    class="remove-recipe-ingredient mt-6 flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-error-container/30 hover:text-error"
                    aria-label="Remove recipe ingredient">
                    <span class="material-symbols-outlined text-sm">delete</span>
                </button>
            `;

            const select = row.querySelector('.recipe-ingredient-select');
            const unit = row.querySelector('.recipe-ingredient-unit');
            ingredients.forEach((ingredient) => {
                const option = document.createElement('option');
                option.value = ingredient.id;
                option.textContent = `${ingredient.name} (${ingredient.unit || '-'})`;
                option.selected = ingredient.id === selectedIngredientId;
                select.appendChild(option);
            });

            select.addEventListener('change', () => {
                unit.textContent = getIngredient(select.value)?.unit || '';
            });
            row.querySelector('.remove-recipe-ingredient').addEventListener('click', () => {
                row.remove();
                if (!recipeList.querySelector('.recipe-ingredient-row')) {
                    showRecipeEmptyState();
                }
            });

            recipeList.appendChild(row);
        };

        const renderRecipe = (recipe) => {
            const items = Array.isArray(recipe?.items) ? recipe.items : [];
            recipeList.innerHTML = '';

            if (!items.length) {
                showRecipeEmptyState();
                return;
            }

            items.forEach((item) => createRecipeRow(item));
        };

        const renderProduct = (product) => {
            currentProduct = product;
            const name = product.name || 'Unnamed Product';
            const description = product.description || 'No description available.';

            setFieldValue(nameElement, name);
            setFieldValue(descriptionElement, description);
            priceInput.value = formatPriceValue(product.selling_price);
            imageUrlInput.value = product.image_url || '';
            populateCategorySelect(productCategories, product.category);

            const mainImage = document.getElementById('product-detail-main-image');
            const imagePlaceholder = document.getElementById('product-detail-image-placeholder');
            if (mainImage) {
                mainImage.alt = name;
                if (product.image_url) {
                    mainImage.src = product.image_url;
                    mainImage.classList.remove('hidden');
                    imagePlaceholder?.classList.add('hidden');
                } else {
                    mainImage.removeAttribute('src');
                    mainImage.classList.add('hidden');
                    imagePlaceholder?.classList.remove('hidden');
                }
            }

            setAvailability(Boolean(product.is_available));
        };

        const renderProductDetail = async () => {
            if (!productId) {
                setFieldValue(nameElement, 'Product not found');
                setFieldValue(descriptionElement, 'Missing product id in the URL.');
                return;
            }

            try {
                const [productsResponse, product, recipe, ingredientsResponse] = await Promise.all([
                    fetchApiData('/products').catch(() => []),
                    fetchApiData(`/products/${encodeURIComponent(productId)}`),
                    fetchApiData(`/products/${encodeURIComponent(productId)}/recipe`).catch(() => ({ items: [] })),
                    fetchApiData('/ingredients').catch(() => []),
                ]);
                ingredients = getListData(ingredientsResponse);
                productCategories = deriveCategories(getListData(productsResponse));
                if (product.category && !productCategories.includes(product.category)) {
                    productCategories = [...productCategories, product.category].sort((first, second) => first.localeCompare(second));
                }
                renderProduct(product);
                renderRecipe(recipe);
            } catch (error) {
                console.error('Failed to load product detail:', error);
                setFieldValue(nameElement, 'Product not found');
                setFieldValue(descriptionElement, 'Cannot load this product. Please return to the menu and check the backend server.');
                setStatus('Cannot load product. Please check the backend server.', 'error');
            }
        };

        const saveProduct = async () => {
            if (!productId || !currentProduct) return;

            const payload = {
                category: categorySelect.value || currentProduct.category,
                name: nameElement.value.trim(),
                description: descriptionElement.value.trim() || null,
                selling_price: parsePriceValue(priceInput.value),
                is_available: Boolean(currentProduct.is_available),
                image_url: imageUrlInput.value.trim() || null,
            };

            if (!payload.name) {
                setStatus('Product name is required.', 'error');
                nameElement.focus();
                return;
            }

            if (!payload.category) {
                setStatus('Product category is required.', 'error');
                categorySelect.focus();
                return;
            }

            if (payload.selling_price <= 0) {
                setStatus('Selling price must be greater than 0.', 'error');
                priceInput.focus();
                return;
            }

            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';
            setStatus('Saving product...');

            try {
                const product = await fetchApiData(`/products/${encodeURIComponent(productId)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });
                renderProduct(product);
                setStatus('Product details saved.');
            } catch (error) {
                console.error('Failed to save product:', error);
                setStatus(error.message || 'Cannot save product. Please check the backend server.', 'error');
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Save Product Details';
            }
        };

        const updateAvailability = async (isAvailable) => {
            if (!productId || !currentProduct) return;

            try {
                setStatus('Updating availability...');
                const product = await fetchApiData(`/products/${encodeURIComponent(productId)}/availability`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ is_available: isAvailable }),
                });
                renderProduct(product);
                setStatus('Availability updated.');
            } catch (error) {
                console.error('Failed to update product availability:', error);
                setStatus(error.message || 'Cannot update product availability. Please check the backend server.', 'error');
            }
        };

        const saveRecipe = async () => {
            if (!productId || !currentProduct) return;

            const rows = [...recipeList.querySelectorAll('.recipe-ingredient-row')];
            if (!rows.length) {
                setStatus('Recipe must include at least one ingredient.', 'error');
                return;
            }

            const items = rows.map((row) => ({
                ingredient_id: row.querySelector('.recipe-ingredient-select')?.value,
                quantity_per_serving: Number(row.querySelector('.recipe-ingredient-quantity')?.value),
            }));

            if (items.some((item) => !item.ingredient_id || item.quantity_per_serving <= 0)) {
                setStatus('Choose an ingredient and enter a positive quantity for every recipe row.', 'error');
                return;
            }

            const ingredientIds = items.map((item) => item.ingredient_id);
            if (new Set(ingredientIds).size !== ingredientIds.length) {
                setStatus('Recipe cannot contain duplicate ingredients.', 'error');
                return;
            }

            saveRecipeButton.disabled = true;
            saveRecipeButton.textContent = 'Saving...';
            setStatus('Saving recipe...');

            try {
                const recipe = await fetchApiData(`/products/${encodeURIComponent(productId)}/recipe`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ items }),
                });
                renderRecipe(recipe);
                setStatus('Recipe saved.');
            } catch (error) {
                console.error('Failed to save recipe:', error);
                setStatus(error.message || 'Cannot save recipe. Please check the backend server.', 'error');
            } finally {
                saveRecipeButton.disabled = false;
                saveRecipeButton.textContent = 'Save Recipe';
            }
        };

        const deleteProduct = async () => {
            if (!productId || !currentProduct) return;
            const confirmed = window.confirm(`Delete ${currentProduct.name || 'this product'}?`);
            if (!confirmed) return;

            deleteButton.disabled = true;
            deleteButton.textContent = 'Deleting...';

            try {
                await fetchApiData(`/products/${encodeURIComponent(productId)}`, {
                    method: 'DELETE',
                });
                window.location.href = 'menu.html';
            } catch (error) {
                console.error('Failed to delete product:', error);
                alert(error.message || 'Cannot delete product. Please check the backend server.');
                deleteButton.disabled = false;
                deleteButton.textContent = 'Delete Product';
            }
        };

        saveButton?.addEventListener('click', saveProduct);
        saveRecipeButton?.addEventListener('click', saveRecipe);
        addRecipeIngredientButton?.addEventListener('click', () => createRecipeRow());
        discardButton?.addEventListener('click', renderProductDetail);
        deleteButton?.addEventListener('click', deleteProduct);
        document.querySelectorAll('[data-availability]').forEach((button) => {
            button.addEventListener('click', () => {
                updateAvailability(button.dataset.availability === 'true');
            });
        });

        renderProductDetail();
    });
  </script>
</body>

</html>
