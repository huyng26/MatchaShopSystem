<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Account Management | The Matcha Atelier</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
      <link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
      <script src="../assets/js/tailwind-config.js"></script>
</head>

<body class="page-account-list bg-surface text-on-surface" data-page="account-list">
    <!-- SideNavBar -->
    <aside id="app-sidebar" class="h-screen w-72 fixed left-0 top-0 z-40 bg-[#002c04] dark:bg-[#001a02] shadow-[32px_0_64px_-12px_rgba(0,44,4,0.08)] flex flex-col py-8 px-6"></aside>
    <!-- TopAppBar -->
    <header id="app-topbar" class="fixed top-0 right-0 left-72 h-20 z-30 bg-[#f9f9f8]/80 dark:bg-[#191c1c]/80 backdrop-blur-2xl flex items-center justify-between px-10"></header>
    <!-- Main Content Canvas -->
    <main class="ml-72 pt-24 p-10 space-y-8">
        <!-- Header Section -->
        <section class="mb-10 flex justify-between items-end">
            <div>
                <h2 class="serif text-4xl text-primary mb-2">Account Management</h2>
            </div>
            <button
                class="management-primary-action bg-secondary text-on-secondary px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-secondary/20 hover:scale-[1.02] transition-transform active:scale-95"
                type="button">
                <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Add new account
            </button>
        </section>
        <!-- Account List -->
        <div class="management-table-card bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden border border-outline-variant/10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-surface-container-low/50 border-b border-outline-variant/10">
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Email</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Role</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Status</th>
                    </tr>
                </thead>
                <tbody id="account-table-body" class="divide-y divide-outline-variant/5">
                    <tr>
                        <td class="px-6 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="4">Loading accounts...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
  <script src="../assets/js/layout.js?v=fm-20260530"></script>
  <script src="../assets/js/main.js?v=fm-20260530"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const tableBody = document.getElementById('account-table-body');
        const API_BASE_URL = window.MATCHA_API_BASE_URL || 'http://localhost:8000/api/v1';

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[character]));

        const formatLabel = (value) => String(value || 'unknown')
            .replace(/[_-]+/g, ' ')
            .replace(/\b\w/g, (character) => character.toUpperCase());

        const getRoleClass = (role) => {
            const normalizedRole = String(role || '').toLowerCase();
            return normalizedRole === 'admin'
                ? 'bg-primary/5 text-primary'
                : 'bg-secondary/10 text-secondary';
        };

        const getStatusClass = (status) => {
            const normalizedStatus = String(status || '').toLowerCase();
            if (normalizedStatus === 'active') {
                return 'bg-secondary-container/30 text-secondary';
            }
            if (normalizedStatus === 'inactive' || normalizedStatus === 'disabled') {
                return 'bg-error-container/30 text-error';
            }
            return 'bg-surface-container-high text-on-surface-variant';
        };

        const fetchAccounts = async () => {
            const token = localStorage.getItem('matcha_access_token');
            const response = await fetch(`${API_BASE_URL}/accounts`, {
                headers: token ? { Authorization: `Bearer ${token}` } : {},
            });
            const payload = await response.json().catch(() => null);

            if (!response.ok || payload?.success === false) {
                throw new Error(payload?.message || 'Request failed');
            }

            const data = payload?.data ?? payload;
            if (Array.isArray(data)) {
                return data;
            }
            return Array.isArray(data?.items) ? data.items : [];
        };

        const renderAccounts = (accounts) => {
            tableBody.innerHTML = '';

            if (!accounts.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td class="px-6 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="4">No accounts found.</td>
                    </tr>
                `;
                return;
            }

            accounts.forEach((account) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-surface-container-low transition-colors';
                row.innerHTML = `
                    <td class="px-6 py-5 text-sm font-bold text-primary">${escapeHtml(account.id)}</td>
                    <td class="px-6 py-5 text-sm font-medium">${escapeHtml(account.email)}</td>
                    <td class="px-6 py-5">
                        <span class="px-3 py-1 ${getRoleClass(account.role)} text-xs font-bold rounded-md">${escapeHtml(formatLabel(account.role))}</span>
                    </td>
                    <td class="px-6 py-5">
                        <span class="px-3 py-1 ${getStatusClass(account.status)} text-xs font-bold rounded-full">${escapeHtml(formatLabel(account.status))}</span>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        };

        const loadAccounts = async () => {
            try {
                const accounts = await fetchAccounts();
                renderAccounts(Array.isArray(accounts) ? accounts : []);
            } catch (error) {
                console.error('Failed to load accounts:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td class="px-6 py-8 text-center text-sm font-bold text-error" colspan="4">Cannot load accounts. Please sign in with an admin account and check the backend server.</td>
                    </tr>
                `;
            }
        };

        loadAccounts();
    });
  </script>
</body>

</html>
