<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Account Management | The Matcha Atelier</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css?v=app-font-20260605" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../assets/js/tailwind-config.js"></script>
</head>

<body class="page-account-list bg-surface text-on-surface" data-page="account-list">
    <aside id="app-sidebar" class="h-screen w-72 fixed left-0 top-0 z-40 bg-[#002c04] dark:bg-[#001a02] shadow-[32px_0_64px_-12px_rgba(0,44,4,0.08)] flex flex-col py-8 px-6"></aside>
    <header id="app-topbar" class="fixed top-0 right-0 left-72 h-20 z-30 bg-[#f9f9f8]/80 dark:bg-[#191c1c]/80 backdrop-blur-2xl flex items-center justify-between px-10"></header>

    <main class="ml-72 pt-24 p-10 space-y-8">
        <section class="mb-10 flex flex-wrap justify-between items-end gap-4">
            <div>
                <h2 class="serif text-4xl text-primary mb-2">Account Management</h2>
                <p class="text-on-surface-variant font-medium">Manage system accounts and access roles.</p>
            </div>
            <button
                id="open-account-modal"
                class="management-primary-action bg-secondary text-on-secondary px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-secondary/20 hover:scale-[1.02] transition-transform active:scale-95"
                type="button">
                <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Add new account
            </button>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
                <p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-1">Total Accounts</p>
                <p id="total-accounts-stat" class="text-3xl font-extrabold text-primary">0</p>
            </div>
            <div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
                <p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-1">Active Accounts</p>
                <p id="active-accounts-stat" class="text-3xl font-extrabold text-secondary">0</p>
            </div>
            <div class="bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/10">
                <p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-1">Admin Accounts</p>
                <p id="admin-accounts-stat" class="text-3xl font-extrabold text-primary">0</p>
            </div>
        </section>

        <div class="management-table-card bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden border border-outline-variant/10">
            <div class="management-filter-bar p-6 border-b border-outline-variant/10 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-3">
                    <select id="role-filter" class="rounded-xl border-outline bg-surface px-4 py-2.5 text-sm font-bold focus:border-secondary focus:ring-secondary">
                        <option value="">All roles</option>
                        <option value="admin">Admin</option>
                        <option value="inventory_manager">Inventory Manager</option>
                        <option value="delivery_manager">Delivery Manager</option>
                        <option value="cashier">Cashier</option>
                        <option value="shipper">Shipper</option>
                    </select>
                    <select id="status-filter" class="rounded-xl border-outline bg-surface px-4 py-2.5 text-sm font-bold focus:border-secondary focus:ring-secondary">
                        <option value="">All statuses</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="locked">Locked</option>
                    </select>
                </div>
                <p id="account-table-count" class="text-xs text-on-surface-variant font-bold">Loading accounts...</p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-surface-container-low/50 border-b border-outline-variant/10">
                            <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Last Login</th>
                            <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Created</th>
                        </tr>
                    </thead>
                    <tbody id="account-table-body" class="divide-y divide-outline-variant/5">
                        <tr>
                            <td class="px-6 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="6">Loading accounts...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="account-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4 py-8 backdrop-blur-sm">
        <div class="w-full max-w-2xl rounded-2xl bg-surface-container-lowest shadow-2xl">
            <div class="flex items-center justify-between border-b border-outline-variant px-8 py-5">
                <div>
                    <h2 class="font-serif text-3xl text-primary">New Account</h2>
                    <p class="text-sm text-on-surface-variant">Create a system login account.</p>
                </div>
                <button id="close-account-modal" type="button"
                    class="flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface">
                    <span class="material-symbols-outlined" data-icon="close">close</span>
                </button>
            </div>
            <form id="account-form" class="space-y-5 px-8 py-7">
                <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                    <label class="space-y-2 md:col-span-2">
                        <span class="text-sm font-bold text-on-surface">Email</span>
                        <input id="account-email" type="email" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
                    </label>
                    <label class="space-y-2">
                        <span class="text-sm font-bold text-on-surface">Password</span>
                        <input id="account-password" type="password" minlength="8" maxlength="72" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
                    </label>
                    <label class="space-y-2">
                        <span class="text-sm font-bold text-on-surface">Role</span>
                        <select id="account-role" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary">
                            <option value="admin">Admin</option>
                            <option value="inventory_manager">Inventory Manager</option>
                            <option value="delivery_manager">Delivery Manager</option>
                            <option value="cashier">Cashier</option>
                            <option value="shipper">Shipper</option>
                        </select>
                    </label>
                    <label class="space-y-2 md:col-span-2">
                        <span class="text-sm font-bold text-on-surface">Status</span>
                        <select id="account-status" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="locked">Locked</option>
                        </select>
                    </label>
                </div>
                <p id="account-form-status" class="hidden text-sm font-bold"></p>
                <div class="flex justify-end gap-3 border-t border-outline-variant pt-5">
                    <button id="cancel-account-modal" type="button"
                        class="rounded-full bg-surface-container-high px-6 py-2.5 text-sm font-bold text-on-surface hover:bg-surface-container-highest">
                        Cancel
                    </button>
                    <button id="save-account" type="submit"
                        class="rounded-full bg-primary px-6 py-2.5 text-sm font-bold text-white hover:bg-primary/90">
                        Save Account
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/layout.js?v=fm-20260530"></script>
    <script src="../assets/js/main.js?v=fm-20260530"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = window.MATCHA_API_BASE_URL || 'http://localhost:8000/api/v1';
            const tableBody = document.getElementById('account-table-body');
            const tableCount = document.getElementById('account-table-count');
            const roleFilter = document.getElementById('role-filter');
            const statusFilter = document.getElementById('status-filter');
            const accountModal = document.getElementById('account-modal');
            const accountForm = document.getElementById('account-form');
            const accountFormStatus = document.getElementById('account-form-status');
            const saveAccountButton = document.getElementById('save-account');

            const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            }[character]));
            const formatLabel = (value) => String(value || 'unknown')
                .replace(/[_-]+/g, ' ')
                .replace(/\b\w/g, (character) => character.toUpperCase());
            const formatDate = (value) => {
                if (!value) return '--';
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? '--' : new Intl.DateTimeFormat('vi-VN').format(date);
            };
            const getTokenHeaders = () => {
                const token = localStorage.getItem('matcha_access_token');
                return token ? { Authorization: `Bearer ${token}` } : {};
            };
            const fetchApiData = async (path, options = {}) => {
                const response = await fetch(`${API_BASE_URL}${path}`, {
                    ...options,
                    headers: {
                        ...getTokenHeaders(),
                        ...(options.headers || {}),
                    },
                });
                const payload = await response.json().catch(() => null);
                if (!response.ok || payload?.success === false) {
                    throw new Error(payload?.message || 'Request failed');
                }
                return payload?.data ?? payload;
            };
            const getRoleClass = (role) => {
                const normalizedRole = String(role || '').toLowerCase();
                return normalizedRole === 'admin'
                    ? 'bg-primary/5 text-primary'
                    : 'bg-secondary/10 text-secondary';
            };
            const getStatusClass = (status) => {
                const normalizedStatus = String(status || '').toLowerCase();
                if (normalizedStatus === 'active') return 'bg-secondary-container/30 text-secondary';
                if (normalizedStatus === 'inactive') return 'bg-error-container/30 text-error';
                if (normalizedStatus === 'locked') return 'bg-surface-container-highest text-on-surface-variant';
                return 'bg-surface-container-high text-on-surface-variant';
            };
            const setFormStatus = (message, type = 'info') => {
                accountFormStatus.textContent = message;
                accountFormStatus.className = `text-sm font-bold ${type === 'error' ? 'text-error' : 'text-secondary'}`;
                accountFormStatus.classList.toggle('hidden', !message);
            };
            const openModal = () => {
                accountForm.reset();
                document.getElementById('account-role').value = 'cashier';
                document.getElementById('account-status').value = 'active';
                setFormStatus('');
                accountModal.classList.remove('hidden');
                accountModal.classList.add('flex');
                document.body.classList.add('overflow-hidden');
            };
            const closeModal = () => {
                accountModal.classList.add('hidden');
                accountModal.classList.remove('flex');
                document.body.classList.remove('overflow-hidden');
            };
            const renderStats = (accounts, total) => {
                document.getElementById('total-accounts-stat').textContent = total ?? accounts.length;
                document.getElementById('active-accounts-stat').textContent = accounts.filter((account) => account.status === 'active').length;
                document.getElementById('admin-accounts-stat').textContent = accounts.filter((account) => account.role === 'admin').length;
            };
            const renderAccounts = (accounts, meta = {}) => {
                tableBody.innerHTML = '';
                const total = meta.total ?? accounts.length;
                tableCount.textContent = `Showing ${accounts.length} of ${total} account${total === 1 ? '' : 's'}`;
                renderStats(accounts, total);

                if (!accounts.length) {
                    tableBody.innerHTML = `
                        <tr>
                            <td class="px-6 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="6">No accounts found.</td>
                        </tr>
                    `;
                    return;
                }

                accounts.forEach((account) => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-surface-container-low transition-colors cursor-pointer';
                    row.addEventListener('click', () => {
                        window.location.href = `account_detail.html?id=${encodeURIComponent(account.id)}`;
                    });
                    row.innerHTML = `
                        <td class="px-6 py-5 text-xs font-bold text-primary">${escapeHtml(account.id)}</td>
                        <td class="px-6 py-5 text-sm font-bold text-on-surface">${escapeHtml(account.email)}</td>
                        <td class="px-6 py-5">
                            <span class="px-3 py-1 ${getRoleClass(account.role)} text-xs font-bold rounded-md">${escapeHtml(formatLabel(account.role))}</span>
                        </td>
                        <td class="px-6 py-5">
                            <span class="px-3 py-1 ${getStatusClass(account.status)} text-xs font-bold rounded-full">${escapeHtml(formatLabel(account.status))}</span>
                        </td>
                        <td class="px-6 py-5 text-sm font-medium text-on-surface-variant">${escapeHtml(formatDate(account.last_login_at))}</td>
                        <td class="px-6 py-5 text-sm font-medium text-on-surface-variant">${escapeHtml(formatDate(account.created_at))}</td>
                    `;
                    tableBody.appendChild(row);
                });
            };
            const loadAccounts = async () => {
                try {
                    const params = new URLSearchParams({ page_size: '100' });
                    if (roleFilter.value) params.set('role', roleFilter.value);
                    if (statusFilter.value) params.set('status', statusFilter.value);
                    const data = await fetchApiData(`/accounts?${params.toString()}`);
                    renderAccounts(Array.isArray(data?.items) ? data.items : [], data || {});
                } catch (error) {
                    console.error('Failed to load accounts:', error);
                    tableCount.textContent = 'Cannot load accounts';
                    renderStats([], 0);
                    tableBody.innerHTML = `
                        <tr>
                            <td class="px-6 py-8 text-center text-sm font-bold text-error" colspan="6">Cannot load accounts. Please sign in with an admin account and check the backend server.</td>
                        </tr>
                    `;
                }
            };

            accountForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (!accountForm.reportValidity()) return;

                const payload = {
                    email: document.getElementById('account-email').value.trim(),
                    password: document.getElementById('account-password').value,
                    role: document.getElementById('account-role').value,
                    status: document.getElementById('account-status').value,
                };

                saveAccountButton.disabled = true;
                saveAccountButton.textContent = 'Saving...';
                setFormStatus('Saving account...');
                try {
                    const createdAccount = await fetchApiData('/accounts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                    closeModal();
                    await loadAccounts();
                    if (createdAccount?.id) {
                        window.location.href = `account_detail.html?id=${encodeURIComponent(createdAccount.id)}`;
                    }
                } catch (error) {
                    console.error('Failed to create account:', error);
                    setFormStatus(error.message || 'Cannot create account. Please sign in with an admin account.', 'error');
                } finally {
                    saveAccountButton.disabled = false;
                    saveAccountButton.textContent = 'Save Account';
                }
            });

            document.getElementById('open-account-modal').addEventListener('click', openModal);
            document.getElementById('close-account-modal').addEventListener('click', closeModal);
            document.getElementById('cancel-account-modal').addEventListener('click', closeModal);
            accountModal.addEventListener('click', (event) => {
                if (event.target === accountModal) closeModal();
            });
            roleFilter.addEventListener('change', loadAccounts);
            statusFilter.addEventListener('change', loadAccounts);
            loadAccounts();
        });
    </script>
</body>

</html>
