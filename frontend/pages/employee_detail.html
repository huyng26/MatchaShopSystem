<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css?v=app-font-20260605" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../assets/js/tailwind-config.js"></script>
</head>

<body class="page-employee-detail bg-background text-on-background min-h-screen" data-page="employee-detail">
  <aside id="app-sidebar" class="h-screen w-72 fixed left-0 top-0 z-40 bg-[#002c04] dark:bg-[#001a02] shadow-[32px_0_64px_-12px_rgba(0,44,4,0.08)] flex flex-col py-8 px-6"></aside>
  <main class="ml-72 min-h-screen">
    <header id="app-topbar" class="fixed top-0 right-0 left-72 h-20 z-30 bg-[#f9f9f8]/80 dark:bg-[#191c1c]/80 backdrop-blur-2xl flex items-center justify-between px-10"></header>
    <div class="p-10 pt-24 space-y-8">
      <section class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h2 id="employee-title" class="font-serif text-4xl text-primary">Employee Detail</h2>
          <p id="employee-subtitle" class="text-outline font-medium">Loaded from staff API</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <button id="delete-staff" type="button"
            class="rounded-xl bg-error-container px-5 py-3 text-sm font-extrabold text-error hover:bg-error hover:text-white">
            <span class="material-symbols-outlined align-middle text-lg" data-icon="delete">delete</span>
            Delete
          </button>
          <button id="save-staff" type="button"
            class="rounded-xl bg-secondary px-6 py-3 text-sm font-extrabold text-white shadow-lg shadow-secondary/15 hover:bg-secondary/90">
            <span class="material-symbols-outlined align-middle text-lg" data-icon="save">save</span>
            Save Profile
          </button>
        </div>
      </section>

      <p id="page-status" class="hidden rounded-xl px-4 py-3 text-sm font-bold"></p>

      <section class="grid grid-cols-12 gap-8">
        <aside class="col-span-12 lg:col-span-4 space-y-8">
          <div class="bg-surface-container-lowest rounded-2xl p-8 text-center shadow-sm border border-outline-variant/10">
            <div id="employee-avatar"
              class="mx-auto flex h-32 w-32 items-center justify-center rounded-full bg-primary-container text-4xl font-extrabold text-primary">
              ST
            </div>
            <h3 id="profile-name" class="font-serif text-3xl mt-6 text-primary">Loading...</h3>
            <p id="profile-role" class="text-secondary font-extrabold tracking-wide uppercase text-xs mt-1">--</p>
            <div class="mt-6 flex justify-center">
              <span id="profile-status" class="rounded-full bg-surface-container-high px-3 py-1 text-xs font-extrabold text-on-surface-variant">--</span>
            </div>
          </div>

          <div class="bg-primary-container rounded-2xl p-8 text-[#f9f9f8]">
            <h4 class="font-serif text-xl mb-6">Staff Summary</h4>
            <div class="space-y-4">
              <div class="flex justify-between items-center bg-[#06440c] p-4 rounded-xl">
                <span class="text-[#f9f9f8]/60 text-sm">Salary</span>
                <span id="summary-salary" class="text-lg font-semibold">--</span>
              </div>
              <div class="flex justify-between items-center bg-[#06440c] p-4 rounded-xl">
                <span class="text-[#f9f9f8]/60 text-sm">Date Joined</span>
                <span id="summary-joined" class="text-lg font-semibold">--</span>
              </div>
              <div class="flex justify-between items-center bg-[#06440c] p-4 rounded-xl">
                <span class="text-[#f9f9f8]/60 text-sm">Open Tasks</span>
                <span id="summary-open-tasks" class="text-lg font-semibold">0</span>
              </div>
            </div>
          </div>
        </aside>

        <div class="col-span-12 lg:col-span-8 space-y-8">
          <section class="bg-surface-container-low rounded-2xl p-8">
            <div class="mb-8 flex items-end justify-between gap-4">
              <div>
                <h4 class="font-serif text-2xl text-primary">Staff Profile</h4>
                <div class="h-1 w-12 bg-secondary mt-2 rounded-full"></div>
              </div>
              <span id="staff-id-label" class="text-outline-variant text-xs font-label">ID: --</span>
            </div>

            <form id="staff-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Full Name</span>
                <input id="staff-full-name" type="text" required
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Phone</span>
                <input id="staff-phone" type="text" required
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Email</span>
                <input id="staff-email" type="email" required
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Role</span>
                <select id="staff-role" required
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary">
                  <option value="admin">Admin</option>
                  <option value="inventory_manager">Inventory Manager</option>
                  <option value="delivery_manager">Delivery Manager</option>
                  <option value="cashier">Cashier</option>
                  <option value="shipper">Shipper</option>
                </select>
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Salary</span>
                <input id="staff-salary" type="number" min="0" step="0.01"
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Date Joined</span>
                <input id="staff-date-joined" type="date" required
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Status</span>
                <select id="staff-status" required
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </label>
              <label class="space-y-2">
                <span class="text-xs text-outline font-label tracking-wider uppercase">Linked User ID</span>
                <input id="staff-user-id" type="text"
                  class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary"
                  placeholder="Optional" />
              </label>
            </form>
          </section>

          <section class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10">
            <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h4 class="font-serif text-2xl text-primary">Staff Tasks</h4>
                <p id="task-count" class="text-sm text-on-surface-variant">Loading tasks...</p>
              </div>
              <button id="open-task-modal" type="button"
                class="rounded-xl bg-primary px-5 py-3 text-sm font-extrabold text-white hover:bg-primary/90">
                <span class="material-symbols-outlined align-middle text-lg" data-icon="add_task">add_task</span>
                Add Task
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-surface-container-low/50">
                    <th class="px-4 py-4 text-[10px] uppercase tracking-widest font-bold text-outline">Title</th>
                    <th class="px-4 py-4 text-[10px] uppercase tracking-widest font-bold text-outline">Due Date</th>
                    <th class="px-4 py-4 text-[10px] uppercase tracking-widest font-bold text-outline">Priority</th>
                    <th class="px-4 py-4 text-[10px] uppercase tracking-widest font-bold text-outline">Status</th>
                    <th class="px-4 py-4 text-[10px] uppercase tracking-widest font-bold text-outline text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="task-table-body" class="divide-y divide-outline-variant/10">
                  <tr>
                    <td class="px-4 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="5">Loading tasks...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <div id="task-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4 py-8 backdrop-blur-sm">
    <div class="w-full max-w-2xl rounded-2xl bg-surface-container-lowest shadow-2xl">
      <div class="flex items-center justify-between border-b border-outline-variant px-8 py-5">
        <div>
          <h2 id="task-modal-title" class="font-serif text-3xl text-primary">New Task</h2>
          <p class="text-sm text-on-surface-variant">Create or update a staff task.</p>
        </div>
        <button id="close-task-modal" type="button"
          class="flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface">
          <span class="material-symbols-outlined" data-icon="close">close</span>
        </button>
      </div>
      <form id="task-form" class="space-y-5 px-8 py-7">
        <input id="task-id" type="hidden" />
        <label class="space-y-2 block">
          <span class="text-sm font-bold text-on-surface">Title</span>
          <input id="task-title" type="text" required
            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
        </label>
        <label class="space-y-2 block">
          <span class="text-sm font-bold text-on-surface">Description</span>
          <textarea id="task-description" rows="3"
            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary"></textarea>
        </label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <label class="space-y-2">
            <span class="text-sm font-bold text-on-surface">Due Date</span>
            <input id="task-due-date" type="date" required
              class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
          </label>
          <label class="space-y-2">
            <span class="text-sm font-bold text-on-surface">Priority</span>
            <select id="task-priority" required
              class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </label>
          <label class="space-y-2">
            <span class="text-sm font-bold text-on-surface">Status</span>
            <select id="task-status" required
              class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary">
              <option value="pending">Pending</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
        </div>
        <p id="task-form-status" class="hidden text-sm font-bold"></p>
        <div class="flex justify-end gap-3 border-t border-outline-variant pt-5">
          <button id="cancel-task-modal" type="button"
            class="rounded-full bg-surface-container-high px-6 py-2.5 text-sm font-bold text-on-surface hover:bg-surface-container-highest">
            Cancel
          </button>
          <button id="save-task" type="submit"
            class="rounded-full bg-primary px-6 py-2.5 text-sm font-bold text-white hover:bg-primary/90">
            Save Task
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/layout.js?v=fm-20260530"></script>
  <script src="../assets/js/main.js?v=fm-20260530"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const API_BASE_URL = window.MATCHA_API_BASE_URL || 'http://localhost:8000/api/v1';
      const staffId = new URLSearchParams(window.location.search).get('id');
      const pageStatus = document.getElementById('page-status');
      const staffForm = document.getElementById('staff-form');
      const saveStaffButton = document.getElementById('save-staff');
      const deleteStaffButton = document.getElementById('delete-staff');
      const taskModal = document.getElementById('task-modal');
      const taskForm = document.getElementById('task-form');
      const taskFormStatus = document.getElementById('task-form-status');
      const taskTableBody = document.getElementById('task-table-body');
      let currentStaff = null;
      let taskCache = [];

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[character]));
      const formatLabel = (value) => String(value || '--')
        .replace(/[_-]+/g, ' ')
        .replace(/\b\w/g, (character) => character.toUpperCase());
      const formatDate = (value) => value
        ? new Intl.DateTimeFormat('vi-VN').format(new Date(value))
        : '--';
      const formatCurrency = (value) => Number(value) || Number(value) === 0
        ? new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(Number(value))
        : '--';
      const getTokenHeaders = () => {
        const token = localStorage.getItem('matcha_access_token');
        return token ? { Authorization: `Bearer ${token}` } : {};
      };
      const fetchApiData = async (path, options = {}) => {
        const response = await fetch(`${API_BASE_URL}${path}`, {
          ...options,
          headers: {
            ...getTokenHeaders(),
            ...(options.headers || {}),
          },
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || payload?.success === false) {
          throw new Error(payload?.message || 'Request failed');
        }
        return payload?.data ?? payload;
      };
      const getListData = (data) => {
        if (Array.isArray(data)) return data;
        if (Array.isArray(data?.items)) return data.items;
        return [];
      };
      const setPageStatus = (message, type = 'info') => {
        pageStatus.textContent = message;
        pageStatus.className = `rounded-xl px-4 py-3 text-sm font-bold ${type === 'error' ? 'bg-error-container text-error' : 'bg-secondary/10 text-secondary'}`;
        pageStatus.classList.toggle('hidden', !message);
      };
      const setTaskFormStatus = (message, type = 'info') => {
        taskFormStatus.textContent = message;
        taskFormStatus.className = `text-sm font-bold ${type === 'error' ? 'text-error' : 'text-secondary'}`;
        taskFormStatus.classList.toggle('hidden', !message);
      };
      const getInitials = (name, email) => {
        const words = String(name || email || '').trim().split(/\s+/).filter(Boolean);
        if (!words.length) return 'ST';
        if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
        return `${words[0][0]}${words[words.length - 1][0]}`.toUpperCase();
      };
      const getStatusClass = (status) => String(status).toLowerCase() === 'active'
        ? 'bg-secondary/10 text-secondary'
        : 'bg-error-container text-error';
      const getTaskStatusClass = (status) => ({
        pending: 'bg-surface-container-high text-on-surface-variant',
        in_progress: 'bg-primary/10 text-primary',
        done: 'bg-secondary/10 text-secondary',
      }[status] || 'bg-surface-container-high text-on-surface-variant');
      const getPriorityClass = (priority) => ({
        low: 'bg-surface-container-high text-on-surface-variant',
        medium: 'bg-primary/10 text-primary',
        high: 'bg-error-container/60 text-error',
        urgent: 'bg-error text-white',
      }[priority] || 'bg-surface-container-high text-on-surface-variant');

      const renderStaff = (staff) => {
        currentStaff = staff;
        document.getElementById('employee-title').textContent = staff.full_name || 'Employee Detail';
        document.getElementById('employee-subtitle').textContent = staff.email || 'Loaded from staff API';
        document.getElementById('profile-name').textContent = staff.full_name || 'Unnamed Staff';
        document.getElementById('profile-role').textContent = formatLabel(staff.role);
        document.getElementById('employee-avatar').textContent = getInitials(staff.full_name, staff.email);
        document.getElementById('profile-status').textContent = formatLabel(staff.status);
        document.getElementById('profile-status').className = `rounded-full px-3 py-1 text-xs font-extrabold ${getStatusClass(staff.status)}`;
        document.getElementById('staff-id-label').textContent = `ID: ${staff.id}`;
        document.getElementById('summary-salary').textContent = formatCurrency(staff.salary);
        document.getElementById('summary-joined').textContent = formatDate(staff.date_joined);

        document.getElementById('staff-full-name').value = staff.full_name || '';
        document.getElementById('staff-phone').value = staff.phone || '';
        document.getElementById('staff-email').value = staff.email || '';
        document.getElementById('staff-role').value = staff.role || 'cashier';
        document.getElementById('staff-salary').value = staff.salary ?? '';
        document.getElementById('staff-date-joined').value = staff.date_joined || '';
        document.getElementById('staff-status').value = staff.status || 'active';
        document.getElementById('staff-user-id').value = staff.user_id || '';
      };

      const renderTasks = (tasks) => {
        taskTableBody.innerHTML = '';
        document.getElementById('task-count').textContent = `Showing ${tasks.length} task${tasks.length === 1 ? '' : 's'}`;
        document.getElementById('summary-open-tasks').textContent = tasks.filter((task) => task.status !== 'done').length;

        if (!tasks.length) {
          taskTableBody.innerHTML = `
            <tr>
              <td class="px-4 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="5">No tasks found for this employee.</td>
            </tr>
          `;
          return;
        }

        tasks.forEach((task) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="px-4 py-4">
              <p class="font-bold text-primary">${escapeHtml(task.title)}</p>
              <p class="text-xs text-on-surface-variant">${escapeHtml(task.description || 'No description')}</p>
            </td>
            <td class="px-4 py-4 text-sm font-medium">${escapeHtml(formatDate(task.due_date))}</td>
            <td class="px-4 py-4">
              <span class="rounded-full px-2.5 py-1 text-[10px] font-extrabold uppercase ${getPriorityClass(task.priority)}">${escapeHtml(formatLabel(task.priority))}</span>
            </td>
            <td class="px-4 py-4">
              <span class="rounded-full px-2.5 py-1 text-[10px] font-extrabold uppercase ${getTaskStatusClass(task.status)}">${escapeHtml(formatLabel(task.status))}</span>
            </td>
            <td class="px-4 py-4">
              <div class="flex justify-end gap-2">
                <button type="button" class="edit-task rounded-lg bg-surface-container-high px-3 py-2 text-primary hover:bg-primary hover:text-white" data-task-id="${escapeHtml(task.id)}">
                  <span class="material-symbols-outlined text-lg" data-icon="edit">edit</span>
                </button>
                <button type="button" class="delete-task rounded-lg bg-error-container px-3 py-2 text-error hover:bg-error hover:text-white" data-task-id="${escapeHtml(task.id)}">
                  <span class="material-symbols-outlined text-lg" data-icon="delete">delete</span>
                </button>
              </div>
            </td>
          `;
          taskTableBody.appendChild(row);
        });
      };

      const loadStaff = async () => {
        if (!staffId) {
          setPageStatus('Missing staff id. Open this page from Employee Management.', 'error');
          saveStaffButton.disabled = true;
          deleteStaffButton.disabled = true;
          document.getElementById('open-task-modal').disabled = true;
          return;
        }

        try {
          const staff = await fetchApiData(`/staff/${encodeURIComponent(staffId)}`);
          renderStaff(staff);
          setPageStatus('');
        } catch (error) {
          console.error('Failed to load staff:', error);
          setPageStatus(error.message || 'Cannot load staff. Please sign in with an admin account.', 'error');
        }
      };

      const loadTasks = async () => {
        if (!staffId) {
          document.getElementById('task-count').textContent = 'No staff selected';
          document.getElementById('summary-open-tasks').textContent = '0';
          taskTableBody.innerHTML = `
            <tr>
              <td class="px-4 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="5">Open an employee profile to manage tasks.</td>
            </tr>
          `;
          return;
        }

        try {
          const tasks = getListData(await fetchApiData(`/staff/tasks?staff_id=${encodeURIComponent(staffId)}&page_size=100`));
          taskCache = tasks;
          renderTasks(taskCache);
        } catch (error) {
          console.error('Failed to load staff tasks:', error);
          document.getElementById('task-count').textContent = 'Cannot load tasks';
          taskTableBody.innerHTML = `
            <tr>
              <td class="px-4 py-8 text-center text-sm font-bold text-error" colspan="5">Cannot load staff tasks. Please sign in with an admin account.</td>
            </tr>
          `;
        }
      };

      const buildStaffPayload = () => ({
        user_id: document.getElementById('staff-user-id').value.trim() || null,
        full_name: document.getElementById('staff-full-name').value.trim(),
        phone: document.getElementById('staff-phone').value.trim(),
        email: document.getElementById('staff-email').value.trim(),
        role: document.getElementById('staff-role').value,
        salary: document.getElementById('staff-salary').value === '' ? null : Number(document.getElementById('staff-salary').value),
        date_joined: document.getElementById('staff-date-joined').value,
        status: document.getElementById('staff-status').value,
      });

      const saveStaff = async () => {
        if (!staffForm.reportValidity() || !staffId) return;

        saveStaffButton.disabled = true;
        saveStaffButton.textContent = 'Saving...';
        setPageStatus('Saving staff profile...');
        try {
          const staff = await fetchApiData(`/staff/${encodeURIComponent(staffId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildStaffPayload()),
          });
          renderStaff(staff);
          setPageStatus('Staff profile saved successfully.');
        } catch (error) {
          console.error('Failed to save staff:', error);
          setPageStatus(error.message || 'Cannot save staff profile.', 'error');
        } finally {
          saveStaffButton.disabled = false;
          saveStaffButton.innerHTML = '<span class="material-symbols-outlined align-middle text-lg" data-icon="save">save</span> Save Profile';
        }
      };

      const deleteStaff = async () => {
        if (!staffId || !confirm('Delete this staff profile?')) return;

        deleteStaffButton.disabled = true;
        setPageStatus('Deleting staff profile...');
        try {
          await fetchApiData(`/staff/${encodeURIComponent(staffId)}`, { method: 'DELETE' });
          window.location.href = 'employee_list.html';
        } catch (error) {
          console.error('Failed to delete staff:', error);
          setPageStatus(error.message || 'Cannot delete staff profile.', 'error');
          deleteStaffButton.disabled = false;
        }
      };

      const openTaskModal = (task = null) => {
        taskForm.reset();
        setTaskFormStatus('');
        document.getElementById('task-id').value = task?.id || '';
        document.getElementById('task-modal-title').textContent = task ? 'Edit Task' : 'New Task';
        document.getElementById('task-title').value = task?.title || '';
        document.getElementById('task-description').value = task?.description || '';
        document.getElementById('task-due-date').value = task?.due_date || '';
        document.getElementById('task-priority').value = task?.priority || 'medium';
        document.getElementById('task-status').value = task?.status || 'pending';
        taskModal.classList.remove('hidden');
        taskModal.classList.add('flex');
        document.body.classList.add('overflow-hidden');
      };

      const closeTaskModal = () => {
        taskModal.classList.add('hidden');
        taskModal.classList.remove('flex');
        document.body.classList.remove('overflow-hidden');
      };

      const saveTask = async (event) => {
        event.preventDefault();
        if (!taskForm.reportValidity() || !staffId) return;

        const taskId = document.getElementById('task-id').value;
        const payload = {
          staff_id: staffId,
          title: document.getElementById('task-title').value.trim(),
          description: document.getElementById('task-description').value.trim() || null,
          due_date: document.getElementById('task-due-date').value,
          priority: document.getElementById('task-priority').value,
          status: document.getElementById('task-status').value,
        };
        const saveTaskButton = document.getElementById('save-task');
        saveTaskButton.disabled = true;
        saveTaskButton.textContent = 'Saving...';
        setTaskFormStatus('Saving task...');

        try {
          await fetchApiData(taskId ? `/staff/tasks/${encodeURIComponent(taskId)}` : '/staff/tasks', {
            method: taskId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          closeTaskModal();
          await loadTasks();
        } catch (error) {
          console.error('Failed to save staff task:', error);
          setTaskFormStatus(error.message || 'Cannot save staff task.', 'error');
        } finally {
          saveTaskButton.disabled = false;
          saveTaskButton.textContent = 'Save Task';
        }
      };

      const deleteTask = async (taskId) => {
        if (!taskId || !confirm('Delete this staff task?')) return;

        try {
          await fetchApiData(`/staff/tasks/${encodeURIComponent(taskId)}`, { method: 'DELETE' });
          await loadTasks();
        } catch (error) {
          console.error('Failed to delete staff task:', error);
          setPageStatus(error.message || 'Cannot delete staff task.', 'error');
        }
      };

      saveStaffButton.addEventListener('click', saveStaff);
      deleteStaffButton.addEventListener('click', deleteStaff);
      document.getElementById('open-task-modal').addEventListener('click', () => openTaskModal());
      document.getElementById('close-task-modal').addEventListener('click', closeTaskModal);
      document.getElementById('cancel-task-modal').addEventListener('click', closeTaskModal);
      taskModal.addEventListener('click', (event) => {
        if (event.target === taskModal) closeTaskModal();
      });
      taskForm.addEventListener('submit', saveTask);
      taskTableBody.addEventListener('click', (event) => {
        const editButton = event.target.closest('.edit-task');
        const deleteButton = event.target.closest('.delete-task');
        if (editButton) {
          const task = taskCache.find((item) => item.id === editButton.dataset.taskId);
          if (task) openTaskModal(task);
        }
        if (deleteButton) {
          deleteTask(deleteButton.dataset.taskId);
        }
      });

      loadStaff();
      loadTasks();
    });
  </script>
</body>

</html>
