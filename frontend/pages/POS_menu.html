<!DOCTYPE html>

<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Point of Sale | The Matcha Atelier</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
      <link rel="stylesheet" href="../assets/css/style.css?v=header-subtitle-20260605" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../assets/js/tailwind-config.js"></script>
</head>

<body class="page-pos-menu bg-surface text-on-surface min-h-screen" data-page="pos-menu">
  <aside id="app-sidebar"
    class="h-screen w-72 fixed left-0 top-0 z-40 bg-[#002c04] dark:bg-[#001a02] shadow-[32px_0_64px_-12px_rgba(0,44,4,0.08)] flex flex-col py-8 px-6">
  </aside>
  <header id="app-topbar"
    class="fixed top-0 right-0 left-72 h-20 z-30 bg-[#f9f9f8]/80 dark:bg-[#191c1c]/80 backdrop-blur-2xl flex items-center justify-between px-10"></header>

  <main class="ml-72 pt-24 p-10 space-y-8 transition-[padding] duration-300" id="posMainContent">
    <section class="flex flex-wrap items-end justify-between gap-4">
      <div class="w-full max-w-none">
        <header class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <h2 class="font-serif text-4xl text-primary" id="posOrderModeTitle">In-shop Order</h2>
            <p class="page-header-subtitle" id="posOrderModeSubtitle">Select an available item, customize it, then add it to the order.</p>
          </div>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
            <div class="flex rounded-2xl bg-surface-container p-1" aria-label="Order type">
              <button class="pos-order-type-button rounded-xl px-4 py-2 text-sm font-bold transition-colors" data-pos-order-type="instore" type="button">
                In-shop
              </button>
              <button class="pos-order-type-button rounded-xl px-4 py-2 text-sm font-bold transition-colors" data-pos-order-type="delivery" type="button">
                Delivery
              </button>
            </div>
          </div>
        </header>

        <div class="space-y-8" id="posMenuSections"></div>
      </div>
    </section>

    <div class="pb-6 text-center">
      <p class="text-[10px] text-stone-400 font-label uppercase tracking-widest">Hoppers' Matcha Internal Portal © 2026</p>
    </div>

    <aside class="hidden fixed right-0 top-14 bottom-0 z-40 w-96 bg-surface-container-low border-l border-surface-container-highest shadow-2xl flex-col" id="posCartPanel">
      <div class="p-6 pb-0">
        <div class="flex items-center justify-between mb-8">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-secondary">shopping_basket</span>
            <h3 class="font-headline text-2xl text-primary" id="posCartTitle">Current Order</h3>
          </div>
          <span class="bg-primary text-white text-[10px] font-bold h-6 min-w-6 px-2 flex items-center justify-center rounded-full" id="posCartCount">0</span>
        </div>
        <div class="flex items-center gap-2 p-3 bg-surface-container-highest/50 rounded-xl mb-6">
          <span class="material-symbols-outlined text-on-surface-variant text-sm">confirmation_number</span>
          <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest" id="posOrderCode">Order Draft</p>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto custom-scrollbar px-6 space-y-4" id="posCartItems"></div>
      <div class="p-8 space-y-6">
        <div class="space-y-2">
          <div class="flex justify-between text-sm text-on-surface-variant">
            <span>Subtotal</span>
            <span class="font-bold" id="posCartSubtotal">0 VND</span>
          </div>
          <div class="pt-4 border-t border-surface-container-highest flex justify-between items-center">
            <span class="font-headline text-2xl text-primary">Total</span>
            <span class="font-headline text-2xl text-secondary" id="posCartTotal">0 VND</span>
          </div>
        </div>
        <button class="w-full bg-secondary text-white py-5 rounded-2xl font-bold text-lg shadow-[0_16px_32px_-8px_rgba(0,110,8,0.3)] transition-all hover:bg-secondary/90 hover:translate-y-[-2px] active:scale-[0.98]" id="posCompleteOrderBtn" type="button">
          Continue to Checkout
        </button>
      </div>
    </aside>
  </main>

  <div class="fixed inset-0 z-[100] hidden" id="custom-modal">
    <div class="absolute inset-0 bg-primary/40 backdrop-blur-sm" id="posModalBackdrop"></div>
    <div class="absolute right-0 top-0 h-full w-[480px] bg-surface flex flex-col shadow-2xl transition-transform duration-500 translate-x-full" id="modal-content">
      <header class="p-8 border-b border-surface-container-highest flex items-center justify-between">
        <div>
          <h3 class="font-headline text-3xl text-primary mb-1">Customize Order</h3>
          <p class="text-on-surface-variant font-medium" id="posModalProductName">Selected item</p>
        </div>
        <button class="w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center transition-colors" id="posModalCloseBtn" type="button">
          <span class="material-symbols-outlined">close</span>
        </button>
      </header>
      <form class="flex-1 flex flex-col min-h-0" id="posCustomizeForm">
        <div class="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
          <section>
            <h4 class="font-headline text-xl text-primary mb-4">Temperature</h4>
            <div class="grid grid-cols-2 gap-4">
              <label class="relative cursor-pointer group">
                <input checked="" class="peer sr-only" name="temperature" type="radio" value="Hot" />
                <div class="bg-surface-container p-5 rounded-2xl border-2 border-transparent peer-checked:border-secondary peer-checked:bg-secondary-container/10 transition-all text-center">
                  <span class="material-symbols-outlined text-3xl text-primary mb-2">local_fire_department</span>
                  <p class="text-sm font-bold text-primary">Hot</p>
                </div>
              </label>
              <label class="relative cursor-pointer group">
                <input class="peer sr-only" name="temperature" type="radio" value="Iced" />
                <div class="bg-surface-container p-5 rounded-2xl border-2 border-transparent peer-checked:border-secondary peer-checked:bg-secondary-container/10 transition-all text-center">
                  <span class="material-symbols-outlined text-3xl text-primary mb-2">ac_unit</span>
                  <p class="text-sm font-bold text-primary">Iced</p>
                </div>
              </label>
            </div>
          </section>

          <section>
            <label class="font-headline text-xl text-primary mb-4 block" for="posIceLevel">Ice level</label>
            <select class="w-full bg-surface-container border-none rounded-2xl px-4 py-4 focus:ring-2 focus:ring-secondary/20" id="posIceLevel" name="iceLevel">
              <option value="No Ice">No Ice</option>
              <option value="30% Ice">30% Ice</option>
              <option value="50% Ice" selected="">50% Ice</option>
              <option value="70% Ice">70% Ice</option>
              <option value="100% Ice">100% Ice</option>
            </select>
          </section>

          <section>
            <label class="font-headline text-xl text-primary mb-4 block" for="posSugarLevel">Sugar level</label>
            <select class="w-full bg-surface-container border-none rounded-2xl px-4 py-4 focus:ring-2 focus:ring-secondary/20" id="posSugarLevel" name="sugarLevel">
              <option value="0% Sugar">0% Sugar</option>
              <option value="25% Sugar">25% Sugar</option>
              <option value="50% Sugar" selected="">50% Sugar</option>
              <option value="75% Sugar">75% Sugar</option>
              <option value="100% Sugar">100% Sugar</option>
            </select>
          </section>

          <section>
            <h4 class="font-headline text-xl text-primary mb-4">Toppings</h4>
            <div class="space-y-3" id="posToppingOptions"></div>
          </section>

          <section>
            <label class="font-headline text-xl text-primary mb-4 block" for="posItemNote">Note</label>
            <textarea class="w-full bg-surface-container border-none rounded-2xl p-4 h-28 focus:ring-2 focus:ring-secondary/20 placeholder:text-on-surface-variant/40" id="posItemNote" name="note" placeholder="e.g., less sweet, separate topping..."></textarea>
          </section>
        </div>
        <footer class="p-8 bg-surface-container-low border-t border-surface-container-highest">
          <button class="w-full bg-primary text-white py-5 rounded-2xl font-bold text-lg transition-transform active:scale-95 shadow-xl" id="posAddToCartBtn" type="submit">
            Add to Order
          </button>
        </footer>
      </form>
    </div>
  </div>

  <script src="../assets/js/layout.js?v=topbar-role-20260610"></script>
  <script src="../assets/js/main.js?v=pos-order-flow-20260607"></script>
</body>

</html>
