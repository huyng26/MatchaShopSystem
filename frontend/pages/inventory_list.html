<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
      <link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
      <script src="../assets/js/tailwind-config.js"></script>
</head>

<body class="page-inventory-list bg-surface text-on-surface" data-page="inventory-list">
    <!-- SideNavBar -->
    <aside id="app-sidebar" class="h-screen w-72 fixed left-0 top-0 z-40 bg-[#002c04] dark:bg-[#001a02] shadow-[32px_0_64px_-12px_rgba(0,44,4,0.08)] flex flex-col py-8 px-6"></aside>
    <!-- TopAppBar -->
    <header id="app-topbar" class="fixed top-0 right-0 left-72 h-20 z-30 bg-[#f9f9f8]/80 dark:bg-[#191c1c]/80 backdrop-blur-2xl flex items-center justify-between px-10"></header>
    <!-- Main Content Canvas -->
    <main class="ml-72 pt-24 p-10 space-y-8">
        <!-- Header Section -->
        <section class="mb-10 flex justify-between items-end">
            <div>
                <h2 class="serif text-4xl text-primary mb-2">Inventory Management</h2>
            </div>
            <button
                id="open-ingredient-modal"
                class="management-primary-action bg-secondary text-on-secondary px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-secondary/20 hover:scale-[1.02] transition-transform active:scale-95">
                <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Add New Item
            </button>
        </section>
        <!-- Inventory List (The Atelier Table) -->
        <div class="management-table-card bg-surface-container-lowest rounded-2xl shadow-sm overflow-hidden border border-outline-variant/10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-surface-container-low/50 border-b border-outline-variant/10">
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Ingredient Name</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Unit</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Current Stock</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Minimum Threshold</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Unit Price</th>
                        <th class="px-6 py-5 text-sm font-bold text-primary-container/60 uppercase tracking-wider">Status</th>
                    </tr>
                </thead>
                <tbody id="ingredients-table-body" class="divide-y divide-outline-variant/5">
                    <tr>
                        <td class="px-6 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="6">Loading ingredients...</td>
                    </tr>
                </tbody>
            </table>
            <!-- Pagination / Footer -->
            <div
                class="management-table-footer px-6 py-4 bg-surface-container-low/30 flex justify-between items-center border-t border-outline-variant/10">
                <p id="ingredients-table-count" class="text-xs text-on-surface-variant font-medium">Loading ingredients...</p>
            </div>
        </div>
    </main>
    <div id="ingredient-modal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4 py-8 backdrop-blur-sm">
        <div class="w-full max-w-2xl rounded-2xl bg-surface-container-lowest shadow-2xl">
            <div class="flex items-center justify-between border-b border-outline-variant px-8 py-5">
                <div>
                    <h2 class="font-serif text-3xl text-primary">New Ingredient</h2>
                    <p class="text-sm text-on-surface-variant">Create a tracked inventory ingredient.</p>
                </div>
                <button id="close-ingredient-modal" type="button"
                    class="flex h-10 w-10 items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface"
                    aria-label="Close ingredient modal">
                    <span class="material-symbols-outlined" data-icon="close">close</span>
                </button>
            </div>
            <form id="ingredient-form" class="space-y-5 px-8 py-7">
                <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                    <label class="space-y-2 md:col-span-2">
                        <span class="text-sm font-bold text-on-surface">Ingredient Name</span>
                        <input id="ingredient-name" type="text" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary"
                            placeholder="E.g. Matcha powder" />
                    </label>
                    <label class="space-y-2">
                        <span class="text-sm font-bold text-on-surface">Unit</span>
                        <input id="ingredient-unit" type="text" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary"
                            placeholder="kg, liter, unit" />
                    </label>
                    <label class="space-y-2">
                        <span class="text-sm font-bold text-on-surface">Unit Price</span>
                        <input id="ingredient-cost" type="number" min="0" step="0.01" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary"
                            placeholder="E.g. 120000" />
                    </label>
                    <label class="space-y-2">
                        <span class="text-sm font-bold text-on-surface">Current Stock</span>
                        <input id="ingredient-stock" type="number" min="0" step="0.001" value="0" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
                    </label>
                    <label class="space-y-2">
                        <span class="text-sm font-bold text-on-surface">Minimum Threshold</span>
                        <input id="ingredient-threshold" type="number" min="0" step="0.001" value="0" required
                            class="w-full rounded-xl border-outline bg-surface px-4 py-3 text-sm focus:border-secondary focus:ring-secondary" />
                    </label>
                </div>
                <p id="ingredient-form-status" class="hidden text-sm font-bold"></p>
                <div class="flex justify-end gap-3 border-t border-outline-variant pt-5">
                    <button id="cancel-ingredient-modal" type="button"
                        class="rounded-full bg-surface-container-high px-6 py-2.5 text-sm font-bold text-on-surface hover:bg-surface-container-highest">
                        Cancel
                    </button>
                    <button id="save-ingredient" type="submit"
                        class="rounded-full bg-primary px-6 py-2.5 text-sm font-bold text-white hover:bg-primary/90">
                        Save Ingredient
                    </button>
                </div>
            </form>
        </div>
    </div>
  <script src="../assets/js/layout.js?v=fm-20260530"></script>
  <script src="../assets/js/main.js?v=fm-20260530"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const tableBody = document.getElementById('ingredients-table-body');
        const tableCount = document.getElementById('ingredients-table-count');
        const openModalButton = document.getElementById('open-ingredient-modal');
        const modal = document.getElementById('ingredient-modal');
        const closeModalButton = document.getElementById('close-ingredient-modal');
        const cancelModalButton = document.getElementById('cancel-ingredient-modal');
        const ingredientForm = document.getElementById('ingredient-form');
        const saveIngredientButton = document.getElementById('save-ingredient');
        const ingredientFormStatus = document.getElementById('ingredient-form-status');
        const API_BASE_URL = window.MATCHA_API_BASE_URL || 'http://localhost:8000/api/v1';

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[character]));

        const formatNumber = (value) => new Intl.NumberFormat('vi-VN').format(Number(value) || 0);
        const formatUnitPrice = (value) => new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND',
            maximumFractionDigits: 0,
        }).format(Number(value) || 0);

        const setFormStatus = (message, type = 'info') => {
            ingredientFormStatus.textContent = message;
            ingredientFormStatus.className = `text-sm font-bold ${type === 'error' ? 'text-error' : 'text-secondary'}`;
            ingredientFormStatus.classList.toggle('hidden', !message);
        };

        const openModal = () => {
            setFormStatus('');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.classList.add('overflow-hidden');
        };

        const closeModal = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
        };

        const getListData = (data) => {
            if (Array.isArray(data)) return data;
            if (Array.isArray(data?.items)) return data.items;
            return [];
        };

        const fetchApiData = async (path, options = {}) => {
            const response = await fetch(`${API_BASE_URL}${path}`, options);
            const payload = await response.json().catch(() => null);

            if (!response.ok || payload?.success === false) {
                throw new Error(payload?.message || 'Request failed');
            }

            return payload?.data ?? payload;
        };

        const getIngredientStatus = (ingredient) => {
            const currentStock = Number(ingredient.current_stock) || 0;
            const minimumThreshold = Number(ingredient.minimum_threshold) || 0;

            if (currentStock <= 0) {
                return {
                    label: 'Out of Stock',
                    dotClass: 'bg-outline',
                    badgeClass: 'bg-surface-container-highest text-on-surface-variant',
                };
            }

            if (currentStock <= minimumThreshold) {
                return {
                    label: 'Low Stock',
                    dotClass: 'bg-error',
                    badgeClass: 'bg-error-container text-error',
                };
            }

            return {
                label: 'In Stock',
                dotClass: 'bg-secondary',
                badgeClass: 'bg-secondary/10 text-secondary',
            };
        };

        const fetchIngredients = async () => {
            return fetchApiData('/ingredients');
        };

        const renderIngredients = (ingredients) => {
            tableBody.innerHTML = '';
            tableCount.textContent = `Showing ${ingredients.length} ingredient${ingredients.length === 1 ? '' : 's'}`;

            if (!ingredients.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td class="px-6 py-8 text-center text-sm font-bold text-on-surface-variant" colspan="6">No ingredients found.</td>
                    </tr>
                `;
                return;
            }

            ingredients.forEach((ingredient) => {
                const status = getIngredientStatus(ingredient);
                const row = document.createElement('tr');
                row.className = 'hover:bg-surface-container-low transition-colors group cursor-pointer';
                row.addEventListener('click', () => {
                    window.location.href = ingredient.id
                        ? `inventory_detail.html?id=${encodeURIComponent(ingredient.id)}`
                        : 'inventory_detail.html';
                });
                row.innerHTML = `
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-primary-container/5 flex items-center justify-center">
                                <span class="material-symbols-outlined text-primary" data-icon="inventory_2">inventory_2</span>
                            </div>
                            <div>
                                <div class="font-extrabold text-primary group-hover:text-secondary">${escapeHtml(ingredient.name)}</div>
                                <p class="text-xs text-on-surface-variant">${escapeHtml(ingredient.id)}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-sm font-medium text-on-surface-variant">${escapeHtml(ingredient.unit)}</td>
                    <td class="px-6 py-5 text-sm font-bold">${escapeHtml(formatNumber(ingredient.current_stock))}</td>
                    <td class="px-6 py-5 text-sm font-bold">${escapeHtml(formatNumber(ingredient.minimum_threshold))}</td>
                    <td class="px-6 py-5 text-sm font-medium">${escapeHtml(formatUnitPrice(ingredient.cost_per_unit))}</td>
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full ${status.dotClass}"></div>
                            <span class="text-[10px] ${status.badgeClass} px-2 py-0.5 rounded uppercase font-bold">${status.label}</span>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        };

        const loadIngredients = async () => {
            try {
                const ingredients = await fetchIngredients();
                renderIngredients(getListData(ingredients));
            } catch (error) {
                console.error('Failed to load ingredients:', error);
                tableCount.textContent = 'Cannot load ingredients';
                tableBody.innerHTML = `
                    <tr>
                        <td class="px-6 py-8 text-center text-sm font-bold text-error" colspan="6">Cannot load ingredients. Please check the backend server.</td>
                    </tr>
                `;
            }
        };

        openModalButton.addEventListener('click', openModal);
        closeModalButton.addEventListener('click', closeModal);
        cancelModalButton.addEventListener('click', closeModal);
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        ingredientForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!ingredientForm.reportValidity()) return;

            const payload = {
                name: document.getElementById('ingredient-name').value.trim(),
                unit: document.getElementById('ingredient-unit').value.trim(),
                current_stock: Number(document.getElementById('ingredient-stock').value),
                cost_per_unit: Number(document.getElementById('ingredient-cost').value),
                minimum_threshold: Number(document.getElementById('ingredient-threshold').value),
            };

            saveIngredientButton.disabled = true;
            saveIngredientButton.textContent = 'Saving...';
            setFormStatus('Saving ingredient...');

            try {
                await fetchApiData('/ingredients', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });
                ingredientForm.reset();
                closeModal();
                await loadIngredients();
            } catch (error) {
                console.error('Failed to create ingredient:', error);
                setFormStatus(error.message || 'Cannot create ingredient. Please check the backend server.', 'error');
            } finally {
                saveIngredientButton.disabled = false;
                saveIngredientButton.textContent = 'Save Ingredient';
            }
        });

        loadIngredients();
    });
  </script>
</body>

</html>
